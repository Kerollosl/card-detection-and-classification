name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q .
      - name: Resolve project dependencies
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt
      - name: Mock camera lifecycle
        run: python -m pip install Flask==3.0.3 numpy==1.26.4 && python -m unittest discover -s tests
